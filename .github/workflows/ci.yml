name: WorkLift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-tests:
    name: Node 测试 + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  python-tests:
    name: Python 转换器测试 + Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: 安装依赖
        run: |
          pip install -r python/requirements.txt
          pip install ruff
      - name: Ruff lint
        run: ruff check python --config ruff.toml
      - name: Python 单元测试
        run: python -m unittest discover -s python/tests